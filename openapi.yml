openapi: 3.1.0
info:
  title: Food Ordering (API Commons)
  version: 0.1.0-draft.20261110
  description: 'The common Food Ordering interface, distilled from the harvested OpenAPI of 77 providers in the
    APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /restaurants:
    get:
      operationId: listRestaurants
      summary: List restaurants
      tags:
      - Restaurants
      x-commons-tier: core
      x-commons-share: 0.882
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Restaurant'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createRestaurant
      summary: Create a restaurant
      tags:
      - Restaurants
      x-commons-tier: extended
      x-commons-share: 0.294
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /restaurants/{restaurant_id}:
    parameters:
    - $ref: '#/components/parameters/restaurant_id'
